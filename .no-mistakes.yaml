no_ci: true
commands:
  prepare: 'node scripts/isolated-home.mjs corepack pnpm install --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false && node scripts/isolated-home.mjs corepack enable --install-directory node_modules/.bin pnpm'
  test: |-
    bash -o pipefail -c '
      digest=.no-mistakes/validation-failure-digest.txt
      catalog_inputs=(src/parser.ts src/axi-credential.schema.json)
      catalog_entries=(parser schema)
      catalog_pending=.cache/falcon-axi-catalog-digests
      rm -f "$digest" || exit
      if output=$(
        exec 2>&1
        printf "format: resolving base and hashing catalog inputs\n" &&
        base=$(git merge-base HEAD refs/remotes/origin/main) &&
        before=$(git hash-object --no-filters "${catalog_inputs[@]}") &&
        before=($before) &&
        printf "format: selecting and formatting changed files\n" &&
        set -- package.json tsconfig.json ":(glob)src/**/*.ts" src/axi-credential.schema.json src/help.json \
          ":(glob)scripts/typescript/*.ts" ":(glob)tests/typescript/*.ts" ":(exclude)scripts/typescript/build-native.ts" &&
        format_status=0 &&
        { { git diff --name-only -z --diff-filter=ACMR "$base" -- "$@" &&
            git ls-files --others --exclude-standard -z -- "$@"; } |
            xargs -0 -r node scripts/isolated-home.mjs corepack pnpm exec prettier --write -- ||
          format_status=$?; } &&
        after=$(git hash-object --no-filters "${catalog_inputs[@]}") &&
        after=($after) &&
        for index in "${!catalog_inputs[@]}"; do
          if [ "${before[index]}" != "${after[index]}" ]; then
            mkdir -p .cache && printf "%s\n" "${catalog_entries[index]}" >> "$catalog_pending" || exit
          fi
        done &&
        if [ "$format_status" -ne 0 ]; then exit "$format_status"; fi &&
        if [ -f "$catalog_pending" ]; then
          pending=$(sort -u "$catalog_pending") &&
          printf "generate: checking built catalog digests\n" &&
          node scripts/isolated-home.mjs corepack pnpm run build &&
          node .typescript-build/scripts/typescript/generate.js --refresh-digests $pending &&
          rm -f "$catalog_pending"
        fi
      ); then
        printf "%s\n" "$output"
        exec node scripts/validation-digest.mjs
      else
        status=$?
        printf "%s\n" "$output" >&2
        (umask 077 && mkdir -p .no-mistakes &&
          printf "===== validation failure digest =====\nCommand: Test preflight\nExit status: %s\n%s\n" "$status" "$output" > "$digest")
        exit "$status"
      fi
    '
  format: |-
    bash -o pipefail -c '
      base=$(git merge-base HEAD refs/remotes/origin/main) || exit
      set -- package.json tsconfig.json ":(glob)src/**/*.ts" src/help.json \
        ":(glob)scripts/typescript/*.ts" ":(glob)tests/typescript/*.ts" ":(exclude)scripts/typescript/build-native.ts" \
        ":(exclude)src/parser.ts"
      { git diff --name-only -z --diff-filter=ACMR "$base" -- "$@" &&
        git ls-files --others --exclude-standard -z -- "$@"; } |
        xargs -0 -r node scripts/isolated-home.mjs corepack pnpm exec prettier --write --
    '
  lint: 'node scripts/isolated-home.mjs corepack pnpm run lint'
test:
  instructions: |
    When commands.test fails, read .no-mistakes/validation-failure-digest.txt in this worktree.
    The digest holds the command, its exit status, the recognized failing lines (failing TAP tests, formatter warnings, TypeScript errors, and named check failures) and the last lines of stdout and stderr.
    Name the failing check from the digest.
    A passing run leaves no digest.
review:
  path_instructions:
    - path: "**"
      instructions: 'Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.'
