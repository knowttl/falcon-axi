no_ci: true
commands:
  prepare: 'node scripts/isolated-home.mjs corepack pnpm install --frozen-lockfile --ignore-scripts --config.confirm-modules-purge=false'
  test: 'node scripts/isolated-home.mjs corepack pnpm run verify'
  lint: 'node scripts/isolated-home.mjs corepack pnpm run lint'
review:
  path_instructions:
    - path: "**"
      instructions: 'Test quality: apply the "Test quality" rules in CONTRIBUTING.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.'
