name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs the npm release pinned by packageManager.
      - run: test "$(npm --version)" = 11.9.0

      - run: npm ci --ignore-scripts

      - run: npm run build

      # Fail before publishing when the tarball cannot be produced.
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      # Keep the registry setting while allowing npm OIDC trusted publishing.
      - name: Remove placeholder auth token
        run: sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"

      # Prereleases publish under `next` and never move `latest`.
      # Only a version without a prerelease part is published as `latest`.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"
