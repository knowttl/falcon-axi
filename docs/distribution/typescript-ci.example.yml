name: typescript-ci-proposal

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
      - run: test "$(npm --version)" = 11.9.0
      - run: npm ci --ignore-scripts
      - run: npm run verify
