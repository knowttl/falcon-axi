[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falcon-axi"
version = "0.8.2"
description = "Read CrowdStrike Falcon from the shell with compact, structured results for agents and the humans running them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "crowdstrike-falconpy>=1.6.5,<2",
  "toon-format>=1.2,<2",
  "tomlkit>=0.13,<1",
]

[project.scripts]
falcon-axi = "falcon_axi.cli:main"
falcon-axi-hook = "falcon_axi.hook:main"

[project.urls]
Repository = "https://github.com/knowttl/falcon-axi"
Issues = "https://github.com/knowttl/falcon-axi/issues"

[dependency-groups]
dev = [
  "graphql-core>=3.3.0",
  "mypy>=1.13",
  "pytest>=8.3",
  "requests-mock>=1.12",
  "ruff>=0.8",
  "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["falcon_axi"]

[tool.hatch.build.targets.sdist]
include = ["/falcon_axi", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 128
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["falcon_axi", "scripts"]

[[tool.mypy.overrides]]
module = "falconpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "toon_format.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/offline"]
